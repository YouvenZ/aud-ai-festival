# Renders the presentation to an MP4 (for a USB stick or a TV) whenever the deck changes,
# and publishes it as a download on the "presentation-video" release.
name: Render presentation video
on:
  push:
    branches: [main]
    paths: ["site/presentation/**", "site/assets/**", "site/vendor/**", "scripts/record-video.mjs", ".github/workflows/video.yml"]
  workflow_dispatch:
    inputs:
      loops: { description: "How many times the deck repeats in the file", default: "1" }
permissions: { contents: write }
concurrency: { group: video, cancel-in-progress: true }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render
        env: { CHROME_PATH: /usr/bin/google-chrome }
        run: node scripts/record-video.mjs --loops ${{ inputs.loops || '1' }} --out video/aud-ai-festival-showcase.mp4
      - uses: actions/upload-artifact@v4
        with: { name: aud-ai-festival-showcase, path: video/aud-ai-festival-showcase.mp4, retention-days: 30 }
      - name: Publish to release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view presentation-video >/dev/null 2>&1 || gh release create presentation-video \
            --title "Presentation video (MP4)" \
            --notes "Auto-rendered from the live deck. 1920x1080, 30 fps, H.264. Copy to a USB stick and play on any TV or laptop."
          gh release upload presentation-video video/aud-ai-festival-showcase.mp4 --clobber
          gh release edit presentation-video --notes "Auto-rendered from commit ${GITHUB_SHA::7} on $(date -u +%F). 1920x1080, 30 fps, H.264 MP4. Copy to a USB stick and play on any TV or laptop."
